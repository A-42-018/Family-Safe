# FamilySafe — Supabase local dev config (Phase 2)
project_id = "familysafe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

# Email links use token_hash -> /auth/confirm (works across browsers; no PKCE verifier cookie needed). Phase 5.
[auth.email.template.confirmation]
subject = "Confirm your FamilySafe account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your FamilySafe password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Public/health endpoint: no JWT. All others default to verify_jwt = true, but
# device-api verifies its own (device) JWT, so Supabase gateway verification is off there (Phase 8/11).
# auth-events / enrollment-create / device-revoke verify the parent JWT themselves via auth.getUser() (works with legacy
# and asymmetric signing keys). enrollment-redeem is intentionally unauthenticated: the single-use pairing code is the credential.
[functions.health]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/health/index.ts"

[functions.auth-events]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/auth-events/index.ts"

[functions.enrollment-create]
